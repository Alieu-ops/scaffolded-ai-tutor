# Scaffold policy version 1 (first proposal, for human review).
# Loaded into the database by the seed script as the initial ACTIVE policy.
# Later versions are proposed and approved in the app (Lecturer > Scaffold policy);
# the LLM can never activate a policy. See 04_SCAFFOLDING_POLICY.md.
#
# DECISION NEEDED (owner + lecturer): how much struggle is productive?
# These thresholds are a starting point, not validated values.

policy_version: "SP-1.0"
max_hint_level: 6                    # 6 = analogous worked example; 7 is a student action
min_attempts_for_consolidation: 1    # level 5 needs at least one submitted attempt to restate
min_attempts_for_analogue: 2         # level 6 needs two wrong answers...
min_hints_before_analogue: 3         # ...and at least three hints already shown
proactive_hints_default: false       # visible setting, OFF by default
low_support_max_level: 3             # levels 1-3 = low support, 4-6 = high support
