[pytest]
# Lets tests import the tutor package from the project folder.
pythonpath = .
testpaths = tests
# Tests marked "live" call the real AI model; they are skipped unless you
# run: pytest -m live
markers =
    live: calls the real language model (needs API key or Ollama)
    regression: written after a real bug was found, so it cannot return unnoticed
addopts = -m "not live"
