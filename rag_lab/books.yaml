# Books used by the RAG lab. The PDFs themselves live OUTSIDE this repository, in
# AI_TUTOR_GUIDED_BUILD/materials/textbooks/ (or the folder named by the RAG_LAB_BOOKS
# environment variable). See materials/TEXTBOOK_REGISTER.md for the licence check.
#
# deployable: true  -> open licence; may be quoted (with attribution) in the deployed tutor
# deployable: false -> copyrighted; offline lab testing only (design decision D17)

