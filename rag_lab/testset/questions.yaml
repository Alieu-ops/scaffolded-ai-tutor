# RAG lab test set, version 0.1 (DRAFT, 13 Oct 2026)
#
# Drafted with an AI assistant from the two open books' tables of contents and page text; NOT yet reviewed.
# I (as demo lecturer) still need to check each entry: is the question realistic, and do the pages
# really contain the answer? Change status to "reviewed" once checked.
#
# Pages are PDF page numbers (1 = first page of the PDF file), as stored by src/extract.py,
# NOT the page numbers printed in the book. A retrieved chunk is a HIT if it overlaps any
# expected range. Questions contain no book text, so this file is safe to commit.
#
# type:
#   direct      uses the book's own terms
#   paraphrase  a student's everyday wording for the same idea
#   absent      not covered by the indexed books: the right result is "nothing relevant"
#   spanning    the answer appears in two places (any of them counts as a hit)
#
# Level 5 indexes only the two open books (olivier, godwin). Adding the copyrighted books
# later is a separate experiment: do extra books help or add distracting noise?

version: "0.1"
status: draft
books_indexed: [olivier, godwin]

questions:
