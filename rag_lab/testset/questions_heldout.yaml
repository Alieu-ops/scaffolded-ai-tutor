  # spanning (2)
  - id: h-s01
    type: spanning
    question: "What is the difference between a population and a sample?"
    expected:
      - {book: godwin, pages: [23, 24], section: "3.2 Populations and Samples"}
      - {book: godwin, pages: [83, 85], section: "8.2 Population versus sample"}
